<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Contact Inquiry</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; }
        .container { max-width: 600px; background: #ffffff; padding: 30px; margin: 0 auto; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #0056b3; padding-bottom: 15px; }
        .logo { max-width: 150px; height: auto; }
        .title { font-size: 20px; color: #0056b3; margin-top: 10px; font-weight: bold; }
        .inquiry-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .inquiry-table td { padding: 12px 10px; border-bottom: 1px solid #eeeeee; }
        .inquiry-table td:first-child { font-weight: bold; color: #555555; width: 30%; }
        .message-title { margin-top: 25px; color: #333333; font-size: 16px; }
        .message-box { background: #f9f9f9; border-left: 4px solid #0056b3; padding: 15px; border-radius: 4px; font-style: italic; white-space: pre-line; color: #333333; }
        .footer { font-size: 12px; color: #777777; text-align: center; margin-top: 30px; border-top: 1px solid #eeeeee; padding-top: 15px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <!-- logo points to the Content-ID "logo" defined in our Java code -->
        <img src="cid:logo" alt="SandebTech Logo" class="logo"/>
        <div class="title">📩 New Contact Inquiry</div>
    </div>

    <table class="inquiry-table">
        <tr>
            <td>Name</td>
            <td th:text="${name}">John Doe</td>
        </tr>
        <tr>
            <td>Email</td>
            <td th:text="${email}">john@example.com</td>
        </tr>
        <tr>
            <td>Phone</td>
            <td th:text="${phone}">N/A</td>
        </tr>
        <tr>
            <td>Company</td>
            <td th:text="${company}">N/A</td>
        </tr>
        <tr>
            <td>Subject</td>
            <td th:text="${subject}">General Question</td>
        </tr>
    </table>

    <h3 class="message-title">Message</h3>
    <div class="message-box" th:text="${message}">
        This is a placeholder for the inquiry message content.
    </div>

    <div class="footer">
        This is an automated system notification.<br>
        <strong>SandebTech Team</strong>
    </div>
</div>
</body>
</html>
