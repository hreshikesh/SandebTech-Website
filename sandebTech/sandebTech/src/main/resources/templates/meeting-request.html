<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Meeting Request</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 25px; background: #f4f4f4; margin: 0;">
<div style="max-width: 650px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
    <img src="cid:logo" width="170" alt="Logo" style="display: block; margin-bottom: 20px;"/>
    <h2 style="color: #f59e0b; margin-top: 0;">📅 New Meeting Request Received</h2>
    <p style="color: #64748b; font-size: 15px; margin-bottom: 20px;">A user has requested a new consultation slot. Please review the details below in your dashboard panel.</p>
    <hr style="border: 0; border-top: 1px solid #e2e8f0; margin-bottom: 20px;">

    <p style="margin: 8px 0; color: #334155;"><strong style="color: #0f172a;">Client Name:</strong> <span th:text="${meeting.user.name}"></span></p>
    <p style="margin: 8px 0; color: #334155;"><strong style="color: #0f172a;">Email Address:</strong> <span th:text="${meeting.user.email}"></span></p>
    <p style="margin: 8px 0; color: #334155;"><strong style="color: #0f172a;">Company:</strong> <span th:text="${meeting.user.company ?: 'N/A'}"></span></p>
    <p style="margin: 8px 0; color: #334155;"><strong style="color: #0f172a;">Requested Date:</strong> <span th:text="${meeting.meetingDate}"></span></p>
    <p style="margin: 8px 0; color: #334155;"><strong style="color: #0f172a;">Time Window:</strong> <span th:text="${meeting.startTime} + ' - ' + ${meeting.endTime}"></span></p>
    <p style="margin: 8px 0; color: #334155;"><strong style="color: #0f172a;">Inquiry Purpose:</strong> <span th:text="${meeting.purpose}"></span></p>
    <p style="margin: 8px 0; color: #334155;"><strong style="color: #0f172a;">Preferred Mode:</strong> <span th:text="${meeting.meetingMode}"></span></p>

    <br>
    <p style="margin: 0; color: #64748b; font-size: 14px;">Automated Notification System,</p>
    <strong style="color: #0f172a; font-size: 16px;">SandebTech Internal</strong>
</div>
</body>
</html>
