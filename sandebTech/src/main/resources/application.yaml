server:
  port: 8080

spring:
  application:
    name: sandebTech


  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER}


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true


  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USER}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

logging:
  level:
    org.springframework.mail: INFO
    org.hibernate.SQL: INFO

jwt:
  secret: ${JWT_SECRET}
  expiration:  ${JWT_EXPIRY}

sandebtech:
  mail:
    contact-recipient: contact@sandebtech.com

google:
  calendar:
    id: primary
  client:
    id: ${GOOGLE_CLIENT_ID}
    secret: ${GOOGLE_SECRET}
    redirect-uri: "https://sandebtech-website.onrender.com/google/oauth2callback"

gemini:
  api:
    key: ${GEMINI_SECRET}
