<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Verification Code</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; }
        .container { max-width: 600px; background: #ffffff; padding: 30px; margin: 0 auto; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header { text-align: center; margin-bottom: 20px; }
        .logo { max-width: 150px; height: auto; }
        .otp-code { font-size: 28px; font-weight: bold; letter-spacing: 4px; color: #0056b3; background: #eef5fc; padding: 15px; text-align: center; border-radius: 6px; margin: 20px 0; }
        .footer { font-size: 12px; color: #777777; text-align: center; margin-top: 30px; border-top: 1px solid #eeeeee; padding-top: 15px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <!-- logo points to the Content-ID "logo" defined in our Java code -->
        <img src="cid:logo" alt="SandebTech Logo" class="logo"/>
    </div>
    <h2>Hello,</h2>
    <p>Your verification code is ready. Please use this to complete your login request.</p>

    <div class="otp-code" th:text="${otp}">000000</div>

    <p>This OTP is valid for <strong>5 minutes</strong>.</p>
    <p>If you did not request this email, please safely ignore it.</p>

    <div class="footer">
        Regards,<br>
        <strong>SandebTech Machine</strong>
    </div>
</div>
</body>
</html>
